[project]
name = "ez-rankings-seo-dashboard"
version = "0.1.0"
requires-python = ">=3.11"

[tool.poetry.dependencies]
celery = "^5.4.0"
redis = "^5.2.1"
python-multipart = "^0.0.18"
cryptography = "^43.0.0"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
# UP035 (import from collections.abc) is fine but causes import noise in migrations
ignore = ["UP035"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E402"]
"tests/*.py" = ["N806"]

[tool.mypy]
python_version = "3.11"
plugins = ["sqlalchemy.ext.mypy.plugin"]
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
