version: "3.9"

services:
  # ── PostgreSQL ─────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ez_rankings
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 512m
    memswap_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256m --maxmemory-policy allkeys-lru
    mem_limit: 300m
    memswap_limit: 300m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── FastAPI app ────────────────────────────────────────────────────
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ez_rankings
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      APP_ENV: development
      PYTHONPATH: /app
      JWT_SECRET_KEY: dev-secret-key-change-in-production
      FRONTEND_URL: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - .:/app
    mem_limit: 256m
    memswap_limit: 256m

  # ── Celery worker ──────────────────────────────────────────────────
  celery-worker:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ez_rankings
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      APP_ENV: development
      PYTHONPATH: /app
      JWT_SECRET_KEY: dev-secret-key-change-in-production
      CELERY_WORKER_PREFETCH_MULTIPLIER: "1"
      CELERY_WORKER_MAX_TASKS_PER_CHILD: "100"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.celery_app:celery_app worker --loglevel=info --concurrency=2 --pool=solo
    volumes:
      - .:/app
    mem_limit: 300m
    memswap_limit: 300m

  # ── Celery beat ────────────────────────────────────────────────────
  celery-beat:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ez_rankings
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      APP_ENV: development
      PYTHONPATH: /app
      JWT_SECRET_KEY: dev-secret-key-change-in-production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.celery_app:celery_app beat --loglevel=info
    volumes:
      - .:/app
    mem_limit: 128m
    memswap_limit: 128m

volumes:
  pgdata:
