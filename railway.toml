[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# The Dockerfile's CMD runs migrations, creates the first super admin (from
# ADMIN_EMAIL / ADMIN_PASSWORD, once) and starts the server on $PORT.
healthcheckPath = "/health/live"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
